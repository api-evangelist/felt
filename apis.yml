apis:
- aid: felt:felt-javascript-sdk
  name: Felt JavaScript SDK
  description: >
    JavaScript SDK for embedding, controlling, and extending Felt maps in external web applications. Supports
    two integration modes: Extensions (custom code inside Felt) and Embed (Felt maps inside external apps).
    Includes Element API, Draw API, and live layer support.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.felt.com/js-sdk/getting-started
  baseURL: https://felt.com
  tags:
  - JavaScript
  - SDK
  - Embed
  - Maps
  - Elements
  properties:
  - type: Documentation
    url: https://developers.felt.com/js-sdk/getting-started
  - type: SDKs
    url: https://github.com/felt/js-sdk
- aid: felt:felt-python-sdk
  name: Felt Python SDK
  description: >
    Official Python client for the Felt REST API providing convenient wrappers for map creation, file
    and DataFrame uploads, layer styling and refreshing, and element management. Supports Pandas and GeoPandas
    integration.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://github.com/felt/felt-python
  baseURL: https://felt.com/api/v2
  tags:
